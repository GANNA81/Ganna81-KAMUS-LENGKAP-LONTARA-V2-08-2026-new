<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamus & Penerjemah Lontara Makassar Lengkap</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #fdfdfd; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 650px; margin: auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { color: #b71c1c; margin-bottom: 5px; }
        .subtitle { color: #777; font-size: 14px; margin-bottom: 20px; }
        
        .search-box { position: relative; margin-bottom: 25px; }
        input { width: 100%; padding: 15px 20px; font-size: 16px; border: 2px solid #ddd; border-radius: 30px; outline: none; box-sizing: border-box; transition: 0.3s; }
        input:focus { border-color: #b71c1c; }

        .result-card { background: #fff5f5; border: 1px solid #ffe0e0; padding: 20px; border-radius: 12px; margin-bottom: 25px; }
        .lontara-big { font-size: 48px; color: #b71c1c; margin: 10px 0; font-weight: bold; }
        .latin-big { font-size: 20px; font-weight: bold; color: #222; }
        .arti-big { font-size: 16px; color: #555; margin-top: 5px; }
        
        .btn-audio { background: #b71c1c; color: white; border: none; padding: 8px 16px; border-radius: 20px; font-size: 14px; cursor: pointer; margin-top: 10px; display: inline-flex; align-items: center; gap: 6px; }
        .btn-audio:hover { background: #900c0c; }

        .dictionary-list { text-align: left; margin-top: 20px; max-height: 600px; overflow-y: auto; padding-right: 5px; }
        .dictionary-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #eee; }
        .dictionary-item:last-child { border-bottom: none; }
        .word-lontara { font-size: 22px; color: #b71c1c; }
        .word-latin { font-weight: bold; }
        .word-arti { color: #666; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Kamus Lontara Makassar</h1>
    <div class="subtitle">Cari kata Latin atau Makassar untuk melihat Aksara Lontara & Suaranya</div>

    <div class="search-box">
        <input type="text" id="searchInput" oninput="cariKata()" placeholder="Ketik kata... (contoh: tabe, aga kareba, je'ne' uring)">
    </div>

    <div class="result-card" id="resultCard" style="display:none;">
        <div class="latin-big" id="resLatin">-</div>
        <div class="lontara-big" id="resLontara">-</div>
        <div class="arti-big" id="resArti">-</div>
        <button class="btn-audio" onclick="putarSuara()">🔊 Dengar Suara</button>
    </div>

    <h3>Daftar Kosakata Lengkap</h3>
    <div class="dictionary-list" id="dictList"></div>
</div>

        { latin: "ule", lontara: "ᨕᨘᨒᨙ", arti: "Ular" },
        { latin: "urang", lontara: "ᨕᨘᨑ", arti: "Udang" }
    ];

    let kataAktif = "";

    function tampilkanDaftar() {
        const listContainer = document.getElementById('dictList');
        listContainer.innerHTML = '';
        kamusKata.forEach(item => {
            listContainer.innerHTML += `
                <div class="dictionary-item">
                    <div>
                        <span class="word-latin">${item.latin}</span> - <span class="word-arti">${item.arti}</span>
                    </div>
                    <div class="word-lontara">${item.lontara}</div>
                </div>
            `;
        });
    }

    function cariKata() {
        const input = document.getElementById('searchInput').value.toLowerCase().trim();
        const resultCard = document.getElementById('resultCard');

        if (input === "") {
            resultCard.style.display = "none";
            return;
        }

        const hasil = kamusKata.find(item => 
            item.latin.toLowerCase() === input || 
            item.latin.toLowerCase().includes(input) || 
            item.arti.toLowerCase().includes(input)
        );

        if (hasil) {
            document.getElementById('resLatin').innerText = hasil.latin;
            document.getElementById('resLontara').innerText = hasil.lontara;
            document.getElementById('resArti').innerText = hasil.arti;
            kataAktif = hasil.latin;
            resultCard.style.display = "block";
        } else {
            document.getElementById('resLatin').innerText = input;
            document.getElementById('resLontara').innerText = "ᨈᨙᨊ";
            document.getElementById('resArti').innerText = "Kata tidak ditemukan di kamus";
            kataAktif = input;
            resultCard.style.display = "block";
        }
    }

    function putarSuara() {
        if (!kataAktif) return;
        const speech = new SpeechSynthesisUtterance(kataAktif);
        speech.lang = 'id-ID';
        speech.rate = 0.9;
        window.speechSynthesis.speak(speech);
    }

    tampilkanDaftar();
</script>

</body>
</html>
